# ===================================================================
# Configuração da Aplicação
# ===================================================================
spring.application.name=gestao-produtos-api
# ===================================================================
# Configuração da Fonte de Dados (H2 Database em Memória)
# ===================================================================
# Banco em memória 'produtodb'; DB_CLOSE_DELAY=-1 mantém os dados enquanto a JVM
estiver ativa
spring.datasource.url=jdbc:h2:mem:produtodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FAL
SE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# ===================================================================
# Console Web do H2 Database
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permite renderização do console em navegadores com proteções de frame
spring.h2.console.settings.web-allow-others=false
# ===================================================================
# Hibernate / Jakarta Persistence
# ===================================================================
# Criação e atualização automática do esquema relacional a partir das entidades
JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Exibição e formatação de queries SQL executadas no console de logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true