# ===================================================
# CONFIGURAÇÃO GERAL DA APLICAÇÃO
# ===================================================
spring.application.name=springBootList

# ===================================================
# DATASOURCE (MYSQL) - configurável por variáveis de ambiente
# Local: usa localhost e a senha padrão abaixo (AJUSTE a senha do seu MySQL)
# ===================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sales?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# ===================================================
# JPA / HIBERNATE
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================
# THYMELEAF
# ===================================================
spring.thymeleaf.cache=false
