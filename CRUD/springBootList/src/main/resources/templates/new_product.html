<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Produto</title>
    <!-- Bootstrap 5.3.8 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div class="container col-lg-6 col-md-8 my-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3">
            <h2 class="h4 mb-0"><i class="bi bi-plus-square me-2"></i>Adicionar Novo Produto</h2>
        </div>
        <div class="card-body p-4">
            <p class="text-muted mb-4">Preencha as informações do novo item abaixo:</p>

            <form action="#" th:action="@{/products/save}" th:object="${product}" method="post">

                <!-- Fragmento de erros de validação -->
                <div th:replace="~{validacao :: validacao}"></div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="name">Nome do Produto:</label>
                    <input class="form-control" type="text" id="name" th:field="*{nome}"
                           placeholder="Ex: Notebook Gamer"/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="brand">Marca:</label>
                    <input class="form-control" type="text" id="brand" th:field="*{marca}"
                           placeholder="Ex: Dell"/>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="made-in">País de Fabricação:</label>
                    <input class="form-control" type="text" id="made-in" th:field="*{paisFabricacao}"
                           placeholder="Ex: Brasil"/>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" for="price">Preço (R$):</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="price"
                           th:field="*{preco}" placeholder="0.00"/>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/products" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar à Lista
                    </a>
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-check2-circle me-1"></i> Salvar Produto
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
